name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Run test suite
        run: pytest -v --cov=pharmascope --cov-report=term-missing

      - name: Run benchmark smoke test
        run: >-
          pharmascope benchmark
          tests/fixtures/faers_pairs.csv
          --cases tests/fixtures/benchmark_cases.json
          --output /tmp/pharmascope-benchmark

      - name: Run life-science evaluation smoke test
        run: >-
          python -m pharmascope.evals
          --tasks configs/evals/life_science_smoke.json
          --responses tests/fixtures/eval_responses.jsonl
          --report /tmp/pharmascope-eval-report.json
