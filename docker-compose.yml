services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pharmascope
      POSTGRES_USER: pharmascope
      POSTGRES_PASSWORD: pharmascope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmascope"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://pharmascope:pharmascope@db:5432/pharmascope
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
